name: Build & Release Ardour

# Builds the latest *stable* Ardour from source (Linux, waf build system) and
# publishes the resulting bundle to GitHub Releases.
#
# Ardour derives its version from `git describe` (tags of the form MAJOR.MINOR,
# e.g. "9.7"). This fork carries no tags, so the workflow fetches the upstream
# release tags, checks out the newest *stable* one (excluding -pre*/-rc*
# pre-releases) by default, builds it, packages the installed tree as a tarball
# and uploads it to a Release.
#
# Trigger it manually from the Actions tab (workflow_dispatch), or push a tag.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Git ref / tag to build (e.g. "9.7"). Leave empty to auto-detect the
          latest stable upstream release.
        required: false
        default: ''
      prerelease:
        description: Mark the GitHub Release as a pre-release
        required: false
        default: false
        type: boolean
  push:
    tags:
      # Stable release tags (MAJOR.MINOR) or conventional v-prefixed tags.
      - '[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+*'

permissions:
  contents: write # required to create/update GitHub Releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/Ardour/ardour.git

jobs:
  build:
    name: Build Ardour (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      tarball: ${{ steps.package.outputs.tarball }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required: the version comes from `git describe`.
          fetch-depth: 0

      - name: Fetch upstream release tags
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_REPO"
          git fetch --tags upstream
          echo "Total tags now available: $(git tag | wc -l)"

      - name: Resolve target ref & version
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          # Determine which ref to build.
          if [ -n "${{ inputs.ref }}" ]; then
            # Manual dispatch with an explicit ref.
            TARGET_REF="${{ inputs.ref }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Triggered by pushing a tag.
            TARGET_REF="${{ github.ref_name }}"
          else
            # Auto-detect the latest *stable* upstream release tag.
            # Stable tags are plain MAJOR.MINOR (optionally MAJOR.MINOR.MICRO),
            # i.e. they do NOT carry a -pre/-rc suffix.
            TARGET_REF="$(git tag --list \
              | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' \
              | sort -t. -k1,1n -k2,2n -k3,3n \
              | tail -n 1)"
          fi

          if [ -z "$TARGET_REF" ]; then
            echo "::error::Could not resolve a target ref to build."
            exit 1
          fi
          echo "Resolved target ref: $TARGET_REF"

          # Resolve it to a commit and make sure we have it locally.
          if ! git rev-parse -q --verify "refs/tags/$TARGET_REF" >/dev/null; then
            git fetch upstream "refs/tags/$TARGET_REF:refs/tags/$TARGET_REF"
          fi

          # Human-readable version: exact tag name if we are right on it,
          # otherwise the `git describe` form (e.g. 9.7-12-gabcdef).
          git checkout --detach "$TARGET_REF"
          VERSION="$(git describe --tags 2>/dev/null || echo "$TARGET_REF")"

          # Compose the values used downstream.
          RELEASE_TAG="$TARGET_REF"
          if [[ "$RELEASE_TAG" != v* ]]; then
            RELEASE_TAG="v$TARGET_REF"
          fi

          {
            echo "target_ref=$TARGET_REF"
            echo "version=$VERSION"
            echo "release_tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

          echo "::notice title=Building Ardour::version=$VERSION (ref $TARGET_REF, release tag $RELEASE_TAG)"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential git python3 pkg-config rsync curl ca-certificates \
            gettext intltool itstool \
            libaubio-dev libasound2-dev libarchive-dev libavahi-client-dev \
            libboost-dev libboost-iostreams-dev \
            libcairomm-1.0-dev libcppunit-dev libcurl4-openssl-dev \
            libdbus-1-dev libebook1.2-dev libudev-dev libfftw3-dev libflac-dev \
            libfluidsynth-dev libfreetype6-dev libglib2.0-dev libglibmm-2.4-dev \
            libgtkmm-2.4-dev libgnomecanvas2-dev libgnomecanvasmm-2.6-dev \
            libjack-jackd2-dev liblo-dev libltc-dev liblilv-dev \
            libogg-dev libpango1.0-dev libpangomm-1.4-dev libpixman-1-dev \
            libpng-dev libpulse-dev librdf0-dev libreadline-dev librubberband-dev \
            libsamplerate0-dev libsndfile1-dev libsoundtouch-dev libserd-dev \
            libsord-dev libsratom-dev libsuil-dev libtag1-dev libusb-1.0-0-dev \
            libvamp-dev libvamp-hostsdk3 libwebsockets-dev libx11-dev libxext-dev \
            libxml2-dev libxslt1-dev lv2-dev zlib1g-dev

      - name: Configure
        run: |
          set -euo pipefail
          ./waf configure \
            --prefix=/usr \
            --with-backends=jack,alsa,pulseaudio,dummy \
            --freedesktop \
            --noconfirm \
            --no-phone-home \
            --optimize

      - name: Build
        run: |
          set -euo pipefail
          ./waf build -j"$(nproc)"

      - name: Install into staging dir
        run: |
          set -euo pipefail
          DESTDIR="$GITHUB_WORKSPACE/stage" ./waf install

      - name: Package tarball
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          # Sanitise the version for use in a filename.
          SAFE_VER="$(echo "$VERSION" | tr -c 'A-Za-z0-9._-' '-')"
          TARBALL="Ardour-${SAFE_VER}-linux-x86_64.tar.gz"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          tar -C "$GITHUB_WORKSPACE/stage" -czf "$GITHUB_WORKSPACE/dist/$TARBALL" .
          ls -lh "$GITHUB_WORKSPACE/dist"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "tarball_path=$GITHUB_WORKSPACE/dist/$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.tarball }}
          path: ${{ steps.package.outputs.tarball_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.tarball }}
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: Ardour ${{ needs.build.outputs.version }}
          # On tag pushes there is no `inputs` context; default to non-prerelease.
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/${{ needs.build.outputs.tarball }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
