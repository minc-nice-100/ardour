name: Build & Release Ardour (Windows)

# Builds the latest *stable* Ardour for Windows (x86_64) and publishes the
# resulting portable bundle (.zip) to GitHub Releases.
#
# Toolchain: MSYS2 (ucrt64) provides the mingw-w64 compiler and every external
# dependency (glib/glibmm/giomm/sndfile/curl/archive/lo/taglib/vamp/rubberband/
# boost/libusb). Ardour vendors its own GTK stack (libs/tk/ytk...), so the GUI
# needs no system GTK. The build is driven by waf with --dist-target=mingw.
#
# Ardour derives its version from `git describe` (tags of the form MAJOR.MINOR,
# e.g. "9.7"). This fork carries no tags, so the workflow fetches the upstream
# release tags and checks out the newest *stable* one (no -pre*/-rc* suffix)
# by default, builds it, zips the installed tree and uploads it to a Release.
#
# Trigger it manually from the Actions tab (workflow_dispatch), or push a tag.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Git ref / tag to build (e.g. "9.7"). Leave empty to auto-detect the
          latest stable upstream release.
        required: false
        default: ''
      prerelease:
        description: Mark the GitHub Release as a pre-release
        required: false
        default: false
        type: boolean
  push:
    tags:
      # Stable release tags (MAJOR.MINOR) or conventional v-prefixed tags.
      - '[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+*'

permissions:
  contents: write # required to create/update GitHub Releases

concurrency:
  group: release-win-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/Ardour/ardour.git
  MSYS2_PATH_TYPE: inherit

jobs:
  build:
    name: Build Ardour (Windows x86_64)
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      archive: ${{ steps.package.outputs.archive }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required: the version comes from `git describe`.
          fetch-depth: 0

      - name: Set up MSYS2 (ucrt64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            python
            rsync
            zip
            unzip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-glibmm
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-liblo
            mingw-w64-ucrt-x86_64-taglib
            mingw-w64-ucrt-x86_64-vamp-plugin-sdk
            mingw-w64-ucrt-x86_64-rubberband
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-portaudio
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-gettext
            mingw-w64-ucrt-x86_64-itstool
            mingw-w64-ucrt-x86_64-aubio
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-cairomm
            mingw-w64-ucrt-x86_64-pango
            mingw-w64-ucrt-x86_64-pangomm
            mingw-w64-ucrt-x86_64-libsamplerate
            mingw-w64-ucrt-x86_64-libogg
            mingw-w64-ucrt-x86_64-flac
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-fluidsynth
            mingw-w64-ucrt-x86_64-lv2
            mingw-w64-ucrt-x86_64-serd
            mingw-w64-ucrt-x86_64-sord
            mingw-w64-ucrt-x86_64-sratom
            mingw-w64-ucrt-x86_64-lilv
            mingw-w64-ucrt-x86_64-libsigc++
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-readline
            mingw-w64-ucrt-x86_64-libwebsockets
            mingw-w64-ucrt-x86_64-cppunit
            mingw-w64-ucrt-x86_64-lrdf

      - name: Fetch upstream release tags
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_REPO"
          git fetch --tags upstream
          echo "Total tags now available: $(git tag | wc -l)"

      - name: Resolve target ref & version
        id: meta
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.ref }}" ]; then
            TARGET_REF="${{ inputs.ref }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TARGET_REF="${{ github.ref_name }}"
          else
            # Latest *stable* upstream tag: plain MAJOR.MINOR[.MICRO], no -pre/-rc.
            TARGET_REF="$(git tag --list \
              | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' \
              | sort -t. -k1,1n -k2,2n -k3,3n \
              | tail -n 1)"
          fi

          if [ -z "$TARGET_REF" ]; then
            echo "::error::Could not resolve a target ref to build."
            exit 1
          fi
          echo "Resolved target ref: $TARGET_REF"

          if ! git rev-parse -q --verify "refs/tags/$TARGET_REF" >/dev/null; then
            git fetch upstream "refs/tags/$TARGET_REF:refs/tags/$TARGET_REF"
          fi

          # The Windows runner enables core.autocrlf, which makes git see the
          # freshly checked-out tree as "modified" and abort a plain checkout of
          # the upstream tag. Disable CRLF translation and force the checkout.
          git config core.autocrlf false
          git reset --hard HEAD
          git checkout -f --detach "$TARGET_REF"
          VERSION="$(git describe --tags 2>/dev/null || echo "$TARGET_REF")"

          RELEASE_TAG="$TARGET_REF"
          if [[ "$RELEASE_TAG" != v* ]]; then
            RELEASE_TAG="v$TARGET_REF"
          fi

          {
            echo "target_ref=$TARGET_REF"
            echo "version=$VERSION"
            echo "release_tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

          echo "::notice title=Building Ardour::version=$VERSION (ref $TARGET_REF, release tag $RELEASE_TAG)"

      - name: Configure (mingw)
        run: |
          set -euo pipefail
          # Put the MSYS POSIX tools (/usr/bin, incl. MSYS python) AND the ucrt64
          # toolchain (/ucrt64/bin) ahead of any Windows native tools on PATH.
          # waf's shebang is `#!/usr/bin/env python`; without /usr/bin first it
          # resolves to the *native* Windows python from setup-msys2, which cannot
          # spawn the POSIX-path compilers and reports "could not configure a C
          # compiler!".
          export PATH="/usr/bin:/ucrt64/bin:$PATH"
          echo "--- interpreter / toolchain sanity ---"
          which python gcc g++ windres pkg-config
          python --version
          gcc --version | head -n1
          echo "--------------------------------------"
          # Point waf at the (unprefixed) ucrt64 compilers explicitly, as the
          # upstream tools/x-win/compile.sh does.
          export CC=gcc CXX=g++ CPP=cpp AR=ar LD=ld NM=nm AS=as \
                 STRIP=strip WINRC=windres RANLIB=ranlib DLLTOOL=dlltool
          python ./waf configure \
            --dist-target=mingw \
            --with-backends=portaudio,dummy \
            --noconfirm \
            --no-dr-mingw \
            --no-phone-home \
            --optimize

      - name: Build
        run: |
          set -euo pipefail
          export PATH="/usr/bin:/ucrt64/bin:$PATH"
          python ./waf build -j"$(nproc)"

      - name: Install into staging dir
        run: |
          set -euo pipefail
          export PATH="/usr/bin:/ucrt64/bin:$PATH"
          python ./waf install --destdir="$GITHUB_WORKSPACE/stage"

      - name: Bundle runtime DLLs
        run: |
          set -euo pipefail
          export PATH="/usr/bin:/ucrt64/bin:$PATH"
          STAGE="$GITHUB_WORKSPACE/stage"
          # waf --dist-target=mingw installs the program + its DLLs under bin/.
          BINDIR="$(find "$STAGE" -type d -name bin | head -n1)"
          if [ -z "$BINDIR" ]; then echo "::error::no bin dir under staging"; exit 1; fi
          echo "Staging bin dir: $BINDIR"
          # Recursively copy every ucrt64 runtime DLL the binaries depend on so
          # the zip runs on a machine without MSYS2 (official package.sh does the
          # same via `cp $PREFIX/bin/*.dll`).
          for f in $(find "$STAGE" -type f \( -name '*.exe' -o -name '*.dll' \)); do
            ntldd -R "$f" 2>/dev/null \
              | awk '/=>/ {print $3}' \
              | grep -i 'ucrt64' || true
          done | sort -u | while read -r dll; do
            win="$(cygpath -u "$dll" 2>/dev/null || echo "$dll")"
            cp -n "$win" "$BINDIR/" 2>/dev/null || true
          done
          echo "Bundled DLL count in bin: $(find "$BINDIR" -name '*.dll' | wc -l)"

      - name: Package zip
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          SAFE_VER="$(echo "$VERSION" | tr -c 'A-Za-z0-9._-' '-')"
          ARCHIVE="Ardour-${SAFE_VER}-windows-x86_64.zip"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ( cd "$GITHUB_WORKSPACE/stage" && zip -r -q "$GITHUB_WORKSPACE/dist/$ARCHIVE" . )
          ls -lh "$GITHUB_WORKSPACE/dist"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "archive_path=$GITHUB_WORKSPACE/dist/$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive }}
          path: ${{ steps.package.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish to GitHub Releases
    needs: build
    runs-on: windows-latest
    if: always() && needs.build.result == 'success'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.archive }}
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: Ardour ${{ needs.build.outputs.version }} (Windows x86_64)
          # On tag pushes there is no `inputs` context; default to non-prerelease.
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/${{ needs.build.outputs.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
